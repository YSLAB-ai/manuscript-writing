<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">manuscript-writing tracked-change style demonstration</title>
  <desc id="desc">A visual demonstration showing original AI prose, tracked changes, the revised result, and reasons for the edits.</desc>
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .panel { fill: #fffdf8; stroke: #d6c9b2; stroke-width: 2; }
      .header { font: 700 30px Arial, sans-serif; fill: #1f2933; }
      .subhead { font: 700 21px Arial, sans-serif; fill: #334155; }
      .body { font: 18px Georgia, serif; fill: #1f2933; }
      .mono { font: 18px Menlo, Consolas, monospace; fill: #1f2933; }
      .small { font: 15px Arial, sans-serif; fill: #465564; }
      .tiny { font: 13px Arial, sans-serif; fill: #5b6775; }
      .red { fill: #b42318; }
      .green { fill: #147a3b; }
      .blue { fill: #1d4ed8; }
      .redbox { fill: #fff1f0; stroke: #e5484d; stroke-width: 1.5; }
      .greenbox { fill: #eefbf3; stroke: #31a46c; stroke-width: 1.5; }
      .bluebox { fill: #eef5ff; stroke: #3b82f6; stroke-width: 1.5; }
      .note { fill: #fff8c5; stroke: #eab308; stroke-width: 1.5; }
      .strike { stroke: #b42318; stroke-width: 3; stroke-linecap: round; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <rect x="28" y="28" width="1344" height="704" rx="24" fill="#fffaf0" stroke="#e6dcc8" stroke-width="2"/>

  <text x="62" y="82" class="header">What the skill actually changes</text>
  <text x="62" y="114" class="small">The skill does not just make prose sound smoother. It checks precision, evidence, hedging, flow,</text>
  <text x="62" y="138" class="small">and unsupported claims.</text>

  <rect x="62" y="150" width="600" height="330" rx="16" class="panel"/>
  <text x="92" y="192" class="subhead">Before: AI-written prose</text>

  <text x="92" y="238" class="body">Memory formation is</text>
  <text x="255" y="238" class="body red">one of the most remarkable and intricate</text>
  <line x1="252" y1="231" x2="590" y2="231" class="strike"/>
  <text x="92" y="270" class="body">processes in biology, transforming fleeting moments</text>
  <text x="92" y="302" class="body">into lasting knowledge, emotions, and skills</text>
  <text x="92" y="334" class="body">that define who we are.</text>

  <rect x="92" y="362" width="510" height="78" rx="10" class="redbox"/>
  <text x="112" y="394" class="mono red">"memory librarian"</text>
  <text x="315" y="394" class="mono red">"hard-wiring"</text>
  <text x="112" y="420" class="mono red">"elegant biological symphony"</text>

  <rect x="708" y="150" width="600" height="330" rx="16" class="panel"/>
  <text x="738" y="192" class="subhead">After: evidence-bounded prose</text>

  <rect x="738" y="216" width="485" height="40" rx="8" class="greenbox"/>
  <text x="754" y="242" class="body green">Memory formation converts sensory experience</text>
  <text x="738" y="286" class="body">into neural representations that can later support</text>
  <text x="738" y="318" class="body">knowledge, emotion, and skill.</text>

  <rect x="738" y="348" width="520" height="84" rx="10" class="bluebox"/>
  <text x="758" y="378" class="mono blue">[citation needed]</text>
  <text x="758" y="406" class="small">working memory, hippocampal consolidation, LTP,</text>
  <text x="758" y="428" class="small">amygdala modulation, sleep-dependent consolidation</text>

  <path d="M670 315 C690 315 690 315 710 315" class="arrow"/>

  <rect x="62" y="520" width="394" height="154" rx="16" class="note"/>
  <text x="88" y="554" class="subhead">Revision rules applied</text>
  <text x="88" y="590" class="small">1. Strip hyperbole and vague praise.</text>
  <text x="88" y="620" class="small">2. Replace metaphors with mechanisms.</text>
  <text x="88" y="650" class="small">3. Flag claims needing citation.</text>

  <rect x="502" y="520" width="394" height="154" rx="16" class="note"/>
  <text x="528" y="554" class="subhead">Review mode output</text>
  <text x="528" y="590" class="small">Location: paragraph 1</text>
  <text x="528" y="620" class="small">Issue: unsupported causal language</text>
  <text x="528" y="650" class="small">Action: hedge or cite the mechanism</text>

  <rect x="942" y="520" width="366" height="154" rx="16" class="note"/>
  <text x="968" y="554" class="subhead">Revision mode output</text>
  <text x="968" y="590" class="small">Edited paragraph</text>
  <text x="968" y="620" class="small">Revision log</text>
  <text x="968" y="650" class="small">Needs Verification list</text>
</svg>
