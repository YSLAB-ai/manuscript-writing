<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI detector smoke test for manuscript-writing</title>
  <desc id="desc">A visual comparison showing the original example reported as 100 percent AI-written and the revised example reported as human-written in a user-run GPTZero check.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#172033" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.48" stop-color="#eef6f3"/>
      <stop offset="1" stop-color="#f7efe7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>

  <text x="72" y="82" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#172033">AI Slop Smoke Test</text>
  <text x="72" y="122" font-family="Inter, Arial, sans-serif" font-size="20" fill="#4b5563">User-run GPTZero check on the README example paragraph</text>

  <g filter="url(#shadow)">
    <rect x="72" y="170" width="520" height="306" rx="22" fill="#ffffff"/>
    <rect x="72" y="170" width="12" height="306" rx="6" fill="#e05252"/>
    <text x="112" y="222" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#172033">Before the skill</text>
    <text x="112" y="258" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6b7280">Original AI-written example</text>
    <circle cx="222" cy="348" r="72" fill="#fff1f1" stroke="#e05252" stroke-width="10"/>
    <text x="222" y="337" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="#b42318">100%</text>
    <text x="222" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#b42318">AI-written</text>
    <text x="332" y="326" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Common signals</text>
    <text x="332" y="358" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">unsupported praise</text>
    <text x="332" y="386" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">metaphor-heavy claims</text>
    <text x="332" y="414" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">overconfident causality</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="688" y="170" width="520" height="306" rx="22" fill="#ffffff"/>
    <rect x="688" y="170" width="12" height="306" rx="6" fill="#2f9e72"/>
    <text x="728" y="222" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#172033">After manuscript-writing</text>
    <text x="728" y="258" font-family="Inter, Arial, sans-serif" font-size="17" fill="#6b7280">Checklist-revised example</text>
    <circle cx="848" cy="348" r="72" fill="#eaf8f1" stroke="#2f9e72" stroke-width="10"/>
    <text x="848" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#146c43">reported</text>
    <text x="848" y="374" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#146c43">human-written</text>
    <text x="958" y="326" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">What changed</text>
    <text x="958" y="358" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">bounded claims</text>
    <text x="958" y="386" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">citation flags</text>
    <text x="958" y="414" font-family="Inter, Arial, sans-serif" font-size="16" fill="#4b5563">connected logic flow</text>
  </g>

  <g>
    <rect x="146" y="524" width="988" height="64" rx="18" fill="#172033"/>
    <text x="640" y="551" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">The goal is not detector gaming.</text>
    <text x="640" y="578" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#d1d5db">Use the detector result as a smoke test for removing generic, unsupported academic-sounding prose.</text>
  </g>
</svg>
